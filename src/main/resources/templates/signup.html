<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録画面</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
	<div class="container">
		<h2>新規登録</h2>

		<form th:action="@{/admin/signup}" th:object="${admin}" method="post">
			<div>
				<div style="display: flex;">
					<label>姓：
						<input type="text" id="last-name" th:field="*{lastName}">
					</label>
					<label>名：
						<input type="text" id="first-name" th:field="*{firstName}">
					</label>
				</div>
				<div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message"></div>
				<div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message"></div>
			</div>
			<div>
				<label for="email">メールアドレス：</label>
				<input type="email" id="email" th:field="*{email}">
				<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
			</div>
			<div>
				<label for="password">パスワード：</label>
				<input type="password" id="password" th:field="*{password}">
				<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
			</div>
			<button type="submit">登録する</button>
		</form>

		<p>
			<a th:href="@{/admin/signin}">ログイン画面へ</a>
		</p>
	</div>
</body>

</html>
